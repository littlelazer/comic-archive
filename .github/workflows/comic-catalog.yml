# ABOUTME: Runs the comic-catalog MCP server's Bun tests (templates/comic-catalog/server) on pull requests and main.
# ABOUTME: Separate from ci.yml so upstream NanoClaw changes to ci.yml merge cleanly; live Metron tests skip without the gateway.
name: comic-catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The server has no dependencies, so there is nothing to install.
      - run: bun test ./templates/comic-catalog/server
